services:
  mason:
    build:
      context: .
    container_name: mason-app-designer
    ports:
      - "8082:8080"
    environment:
      DEPLOYMENT_API_TOKEN: "${DEPLOYMENT_API_TOKEN:-}"
      METADATA_DB_PATH: /data/carecanvas-metadata.sqlite
    volumes:
      - mason-sites:/data
    restart: unless-stopped

volumes:
  mason-sites: